<div class="galeria-dos-columnas">
  <style>
    .galeria-dos-columnas {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
      margin: 2rem 0;
      align-items: start;
    }
    @media (min-width: 640px) {
      .galeria-dos-columnas {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>

  <!-- Imagen 1 -->
  <figure class="article-figure">
    <img src="{{ .Get "src1" | relURL }}" alt="{{ .Get "alt1" | default (.Get "caption1") | default "Imagen 1" }}">
    
    {{ if or (.Get "caption1") (.Get "source1") }}
    <figcaption class="figure-caption">
      {{ if .Get "caption1" }}
        <p class="caption-text">{{ .Get "caption1" | markdownify | safeHTML }}</p>
      {{ end }}
      {{ if .Get "source1" }}
        <p class="caption-source">{{ if eq .Site.Language.Lang "en" }}Source:{{ else }}Fuente:{{ end }} {{ .Get "source1" | markdownify }}</p>
      {{ end }}
    </figcaption>
    {{ end }}
  </figure>

  <!-- Imagen 2 -->
  <figure class="article-figure">
    <img src="{{ .Get "src2" | relURL }}" alt="{{ .Get "alt2" | default (.Get "caption2") | default "Imagen 2" }}">
    
    {{ if or (.Get "caption2") (.Get "source2") }}
    <figcaption class="figure-caption">
      {{ if .Get "caption2" }}
        <p class="caption-text">{{ .Get "caption2" | markdownify | safeHTML }}</p>
      {{ end }}
      {{ if .Get "source2" }}
        <p class="caption-source">{{ if eq .Site.Language.Lang "en" }}Source:{{ else }}Fuente:{{ end }} {{ .Get "source2" | markdownify }}</p>
      {{ end }}
    </figcaption>
    {{ end }}
  </figure>
</div>
